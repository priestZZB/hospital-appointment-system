server:
  port: 28080

springdoc:
  swagger-ui:
    enabled: true
    urls-primary-name: auth-service
    urls:
      - name: auth-service / 认证授权中心
        url: /v3/api-docs/auth-service
      - name: patient-service / 患者档案中心
        url: /v3/api-docs/patient-service
      - name: clinic-service / 核心诊疗服务
        url: /v3/api-docs/clinic-service
      - name: payment-service / 支付调度服务
        url: /v3/api-docs/payment-service
      - name: medsupply-service / 医辅物资服务
        url: /v3/api-docs/medsupply-service
      - name: inpatient-service / 住院服务
        url: /v3/api-docs/inpatient-service
      - name: ai-service / AI辅助服务
        url: /v3/api-docs/ai-service
  api-docs:
    enabled: true

spring:
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      # ==================== 路由规则 ====================
      routes:
        # auth-service: 认证、用户、角色、审计日志
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/api/auth/**,/api/admin/user/**,/api/admin/role/**,/api/admin/audit-log/**
        # patient-service: 患者档案、实名认证、过敏史、文件上传
        - id: patient-service
          uri: lb://patient-service
          predicates:
            - Path=/api/patient/**,/api/admin/patient/**
        # clinic-service: 科室、排班、号源、挂号、签到、叫号、接诊、病历、处方、停诊、BI、WebSocket
        - id: clinic-service
          uri: lb://clinic-service
          predicates:
            - Path=/api/clinic/**,/api/department/**,/api/schedule/**,/api/slot/**,/api/order/**,/api/checkin/**,/api/call/**,/api/queue/**,/api/consultation/**,/api/medical-record/**,/api/prescription/**,/api/stop/**,/api/bi/**,/api/ws/**
        # medsupply-service: 药品、检查项、发药、报告、输液、检验、影像、预约
        - id: medsupply-service
          uri: lb://medsupply-service
          predicates:
            - Path=/api/medsupply/**,/api/admin/drug/**,/api/admin/exam/**,/api/exam/**,/api/admin/drug/dispense/**,/api/infusion/**,/api/lab/**,/api/admin/lab/**
        # inpatient-service: 住院（入院/床位/医嘱/执行/生命体征/预交金/出院）
        - id: inpatient-service
          uri: lb://inpatient-service
          predicates:
            - Path=/api/inpatient/**,/api/admin/inpatient/**
        # payment-service: 支付、退款、通知、凭证
        - id: payment-service
          uri: lb://payment-service
          predicates:
            - Path=/api/payment/**,/api/notification/**
        # ai-service: AI 分诊
        - id: ai-service
          uri: lb://ai-service
          predicates:
            - Path=/api/ai/**
        # ==================== Swagger 文档聚合路由 ====================
        - id: auth-service-swagger
          uri: lb://auth-service
          predicates:
            - Path=/v3/api-docs/auth-service
          filters:
            - RewritePath=/v3/api-docs/auth-service, /v3/api-docs
        - id: patient-service-swagger
          uri: lb://patient-service
          predicates:
            - Path=/v3/api-docs/patient-service
          filters:
            - RewritePath=/v3/api-docs/patient-service, /v3/api-docs
        - id: clinic-service-swagger
          uri: lb://clinic-service
          predicates:
            - Path=/v3/api-docs/clinic-service
          filters:
            - RewritePath=/v3/api-docs/clinic-service, /v3/api-docs
        - id: medsupply-service-swagger
          uri: lb://medsupply-service
          predicates:
            - Path=/v3/api-docs/medsupply-service
          filters:
            - RewritePath=/v3/api-docs/medsupply-service, /v3/api-docs
        - id: inpatient-service-swagger
          uri: lb://inpatient-service
          predicates:
            - Path=/v3/api-docs/inpatient-service
          filters:
            - RewritePath=/v3/api-docs/inpatient-service, /v3/api-docs
        - id: payment-service-swagger
          uri: lb://payment-service
          predicates:
            - Path=/v3/api-docs/payment-service
          filters:
            - RewritePath=/v3/api-docs/payment-service, /v3/api-docs
        - id: ai-service-swagger
          uri: lb://ai-service
          predicates:
            - Path=/v3/api-docs/ai-service
          filters:
            - RewritePath=/v3/api-docs/ai-service, /v3/api-docs

      # ==================== 全局 CORS 跨域 ====================
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns: "*"
            allowedMethods: "*"
            allowedHeaders: "*"
            allowCredentials: false  # 开发环境关闭凭据，避免与 allowedOriginPatterns:* 冲突
            maxAge: 3600

    # ==================== Sentinel 控制台 ====================
    sentinel:
      transport:
        dashboard: localhost:18080  # Sentinel 控制台地址，非网关自身端口，按实际部署配置
        port: 8719
      # 饥饿加载（避免首次访问慢）
      eager: true
      # Sentinel Gateway 专用配置（使用 Java 配置的 BlockRequestHandler，故注释 YAML fallback）

# ==================== 日志 ====================
logging:
  level:
    com.hospital.gateway: DEBUG
    com.alibaba.cloud.sentinel: DEBUG

# ==================== Gateway JWT 白名单（逗号分隔） ====================
gateway:
  jwt:
    whitelist: /api/auth/register,/api/auth/login,/api/ws/**,/v3/api-docs/**,/swagger-ui.html,/swagger-ui/**,/webjars/**
